async function updateAvatar(input){const u=user(),file=input.files?.[0];if(!u||!file)return;if(!file.type.startsWith('image/'))return toast('Избери файл със снимка');if(file.size>40e6)return toast('Снимката трябва да е до 40 MB');await act(async()=>{const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});const path=await upload('avatars',`${u.id}/${Date.now()}.jpg`,await resizeAvatar(data));chk(await sb.from('profiles').update({avatar_path:path}).eq('id',u.id));await refresh()},'Профилната снимка е обновена')}
function resizeAvatar(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{const size=320,c=document.createElement('canvas');c.width=c.height=size;const ctx=c.getContext('2d');const side=Math.min(im.width,im.height);ctx.drawImage(im,(im.width-side)/2,(im.height-side)/2,side,side,0,0,size,size);resolve(c.toDataURL('image/jpeg',.78))};im.onerror=reject;im.src=src})}
async function removeAvatar(){const u=user();if(!u)return;await act(async()=>{chk(await sb.from('profiles').update({avatar_path:null}).eq('id',u.id));await refresh()},'Снимката е премахната')}
function photosHtml(arr,rem=false){const t=rem===true?'files':rem;return `<div class="photos">${(arr||[]).map((p,i)=>`<div class="photo-wrap"><img src="${p}" alt="Снимка ${i+1}" onclick="zoom('${p}')">${t?`<button type="button" aria-label="Премахни снимката" onclick="removeFile(${i},'${t}')">×</button>`:''}</div>`).join('')}</div>`}let lbList=[],lbIdx=0;
function zoom(src){const g=window.event?.target?.closest?.('.photos');lbList=g?[...g.querySelectorAll('img')].map(i=>i.getAttribute('src')):[src];lbIdx=Math.max(0,lbList.indexOf(src));if(!lbList.length)lbList=[src];lbShow()}
function lbShow(){let o=$('#lightbox');if(!o){o=document.createElement('div');o.id='lightbox';o.setAttribute('role','dialog');o.setAttribute('aria-label','Снимка');o.onclick=e=>{if(e.target===o||e.target.tagName==='IMG')lbClose()};let sx=null;o.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});o.addEventListener('touchend',e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)lbStep(d<0?1:-1);sx=null});document.body.append(o);document.addEventListener('keydown',lbKey)}
 const many=lbList.length>1;o.innerHTML=`<img src="${lbList[lbIdx]}" alt="Снимка ${lbIdx+1}"><button class="lb-x" onclick="lbClose()" aria-label="Затвори">✕</button>${many?`<button class="lb-prev" onclick="lbStep(-1)" aria-label="Предишна">‹</button><button class="lb-next" onclick="lbStep(1)" aria-label="Следваща">›</button><div class="lb-count">${lbIdx+1} / ${lbList.length}</div>`:''}`}
function lbStep(d){lbIdx=(lbIdx+d+lbList.length)%lbList.length;lbShow()}
function lbClose(){$('#lightbox')?.remove();document.removeEventListener('keydown',lbKey)}
function lbKey(e){if(e.key==='Escape')lbClose();else if(e.key==='ArrowRight')lbStep(1);else if(e.key==='ArrowLeft')lbStep(-1)}
async function pickImages(input,target='files',max=5){const all=Array.from(input.files||[]),box=$('#preview');if(!all.length)return;const before=pickList(target).length;if(before>=max){input.value='';return toast(`Може най-много ${max} снимки`)}const keep=box?.innerHTML||'';if(box)box.insertAdjacentHTML('beforeend','<p class="muted small" id="picking">Обработват се снимките…</p>');let out=[],bad=0,big=0;for(const file of all.slice(0,max-before)){const isImg=file.type.startsWith('image/')||/\.(jpe?g|png|webp|gif|heic|heif|bmp)$/i.test(file.name);if(!isImg){bad++;continue}if(file.size>40e6){big++;continue}const data=await resize(file);if(data)out.push(data);else bad++}const prev=pickList(target),room=Math.max(0,max-prev.length),added=out.slice(0,room),merged=prev.concat(added);setPickList(target,merged);if(box)box.innerHTML=merged.length?photosHtml(merged,target):'';out=added;const msg=[out.length?`${out.length} ${out.length===1?'снимка е добавена':'снимки са добавени'}`:'',bad?`${bad} не може да се отвори (опитай JPG или PNG)`:'',big?`${big} е над 40 MB`:'',before+all.length>max?`може най-много ${max}`:''].filter(Boolean).join(' · ');toast(msg||'Няма добавени снимки');input.value=''}
// Снимката се намалява до 1600 px и се записва като JPEG; големите снимки от телефон стават ~300 KB
function resize(file){return new Promise(resolve=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,1600/img.width,1600/img.height);c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.8))};img.onerror=()=>{URL.revokeObjectURL(url);resolve(null)};img.src=url})}const pickList=t=>t==='chatFiles'?chatFiles:t==='portfolioFiles'?portfolioFiles:t==='reviewFiles'?reviewFiles:files;function setPickList(t,v){if(t==='chatFiles')chatFiles=v;else if(t==='portfolioFiles')portfolioFiles=v;else if(t==='reviewFiles')reviewFiles=v;else files=v}function removeFile(i,t='files'){const l=[...pickList(t)];l.splice(i,1);setPickList(t,l);const b=$('#preview');if(b)b.innerHTML=l.length?photosHtml(l,t):''}

function requests(){let rr=visibleRequests();return `<div class="row"><h2>${user()?.role==='provider'?'Налични заявки':'Моите заявки'}</h2>${user()?.role==='customer'?btn('+ Нова',"go('new')",'tiny'):''}</div>${rr.length?`<div class="list">${rr.map(r=>`<div class="card"><span class="chip">${status(r.status)}</span><h3>${esc(r.title)}</h3><p class="muted">${esc(r.category)} · ${esc(r.city)} · ${date(r.created)}</p><p>${esc(r.description.slice(0,110))}</p><div class="row"><strong>${r.budget?money(r.budget):'По договаряне'}</strong>${btn('Отвори',`go('request','${r.id}')`,'tiny secondary')}</div></div>`).join('')}</div>`:'<div class="empty">Няма заявки за показване.</div>'}`}
function status(s){return ({open:'Отворена',booked:'Приета',done:'Завършена',cancelled:'Отменена',pending:'Чака',accepted:'Приета',rejected:'Отказана'})[s]||s}
function requestPage(){let r=req(selected),u=user();if(!r)return requests();let owner=u?.id===r.customerId,pro=u?.role==='provider',oo=db.offers.filter(o=>o.requestId===r.id);const adm=u?.role==='admin',c=byId(r.customerId);return `<button class="back" onclick="${adm&&adminTab?"go('admin')":"go('requests')"}">← ${adm&&adminTab?'Администратор':'Заявки'}</button><span class="chip">${status(r.status)}</span><h2>${esc(r.title)}</h2><p class="muted">${esc(r.category)} · ${esc(r.city)} · ${date(r.created)}</p>${adm?`<div class="card requester"><p class="muted small">Заявката е подадена от</p><div class="requester-row">${c?.avatar?`<img src="${c.avatar}" alt="">`:`<span class="requester-ini">${esc((c?.name||'?').trim()[0]||'?')}</span>`}<div><strong>${esc(c?.name||'Изтрит потребител')}</strong>${c?`<p class="small">${c.email?`<a href="mailto:${esc(c.email)}">✉ ${esc(c.email)}</a>`:''}</p><p class="muted small">${[ROLE_BG[c.role],c.city].filter(Boolean).map(esc).join(' · ')} · Регистриран: ${dt(c.created)}</p><p class="muted small">Общо заявки: ${db.requests.filter(x=>x.customerId===c.id).length} · Поръчки: ${db.bookings.filter(x=>x.customerId===c.id).length}</p>`:''}</div></div>${c?btn('Всички заявки на този клиент',`adminTab='requests';adminSub='';adminQ='${esc(c.name).replace(/'/g,"\\'")}';go('admin')`,'tiny ghost'):''}</div>`:''}<div class="card"><strong>Описание</strong><p>${esc(r.description)}</p>${photosHtml(r.photos)}<p class="muted">Бюджет: ${r.budget?money(r.budget):'По договаряне'}</p></div><h3 id="offers" style="scroll-margin-top:80px">Оферти (${oo.length})</h3>${oo.filter(o=>owner||o.providerId===u?.id||u?.role==='admin').map(o=>`<div class="card"><strong>${esc(byId(o.providerId)?.name)}</strong><p class="muted">${esc(o.message)}</p><div class="row"><strong>${money(o.price)}</strong><span class="chip">${status(o.status)}</span></div>${owner&&r.status==='open'?btn('Приеми оферта',`acceptOffer('${o.id}')`,'wide'):''}${owner?btn('Чат',`startChat('${o.providerId}','${r.id}')`,'secondary tiny'):''}</div>`).join('')}${pro&&r.status==='open'&&!oo.some(o=>o.providerId===u.id)?`<form class="card" onsubmit="sendOffer(event,'${r.id}')"><h3>Изпрати оферта</h3><label class="field">Цена (€)<input name="price" type="number" min="1" required></label><label class="field">Съобщение<textarea name="message" required maxlength="1000" ${wsAttrs}></textarea></label><div class="wsug"></div><button class="btn wide">Изпрати</button></form>`:''}${owner&&r.status==='open'?btn('Отмени заявка',`cancelRequest('${r.id}')`,'secondary wide'):''}`}
async function sendOffer(e,id){e.preventDefault();const form=e.target,f=new FormData(form);busy(form,true);const ok=await act(async()=>chk(await sb.from('offers').insert({request_id:id,provider_id:user().id,price:Number(f.get('price')),message:String(f.get('message')).trim()})),'Офертата е изпратена');busy(form,false);if(ok)await refresh()}
async function acceptOffer(id){if(await act(async()=>chk(await sb.rpc('accept_offer',{p_offer:id})),'Офертата е приета')){await loadAll();go('orders')}}
async function cancelRequest(id){if(!confirm('Да отменя ли заявката?'))return;if(await act(async()=>chk(await sb.from('requests').update({status:'cancelled'}).eq('id',id)),'Заявката е отменена'))await refresh()}
function direct(){let p=byId(selected);if(!p)return browse();return `<button class="back" onclick="go('provider','${p.id}')">← Назад</button><h2>Директна резервация</h2><p class="muted">${esc(p.name)} · ${esc(p.category)}</p><form onsubmit="directBook(event,'${p.id}')"><label class="field">Дата<input type="date" name="date" min="${new Date().toISOString().slice(0,10)}" required></label><label class="field">Час<select name="time">${opt(['09:00','10:00','11:00','13:00','15:00','17:00'])}</select></label><label class="field">Описание<textarea name="details" required></textarea></label><label class="field">Начин на плащане<select name="payment"><option value="direct">Директно към специалиста</option><option value="online-demo">Онлайн — симулация (без реално плащане)</option></select></label><button class="btn wide">Резервирай</button></form><p class="warning">Часовете са демонстрационни. Няма реална проверка на календар или плащане.</p>`}
async function directBook(e,pid){e.preventDefault();if(user()?.role!=='customer')return toast('Резервацията е само за клиент');const form=e.target,f=new FormData(form);busy(form,true);const ok=await act(async()=>chk(await sb.from('bookings').insert({customer_id:user().id,provider_id:pid,price:byId(pid)?.price||0,date:f.get('date'),time:f.get('time'),details:String(f.get('details')),payment:f.get('payment')})),'Резервацията е записана');busy(form,false);if(ok){await loadAll();go('orders')}}
function orders(){let u=user(),bs=db.bookings.filter(b=>u?.role==='admin'||b.customerId===u?.id||b.providerId===u?.id);return `<h2>Поръчки</h2>${bs.length?`<div class="list">${bs.map(b=>`<div class="card"><span class="chip">${status(b.status)}</span><h3>${esc(b.requestId?req(b.requestId)?.title:byId(b.providerId)?.category)}</h3><p class="muted">Клиент: ${esc(byId(b.customerId)?.name)} · Специалист: ${esc(byId(b.providerId)?.name)}</p><p class="muted">${b.date?`${b.date} · ${b.time}`:''} · ${b.payment==='online-demo'?'Онлайн (демо)':'Директно плащане'}</p><div class="row"><strong>${money(b.price)}</strong>${btn('Чат',`startChat('${b.customerId===u?.id?b.providerId:b.customerId}','${b.requestId||b.id}')`,'tiny secondary')}</div>${b.status==='booked'&&b.providerId===u?.id?btn('Маркирай завършена',`complete('${b.id}')`,'wide'):''}${b.status==='done'&&b.customerId===u?.id&&!db.reviews.some(x=>x.bookingId===b.id)?btn('Остави отзив',`reviewFiles=[];go('review','${b.id}')`,'wide secondary'):''}</div>`).join('')}</div>`:'<div class="empty">Все още няма поръчки.</div>'}`}
async function complete(id){if(await act(async()=>chk(await sb.rpc('complete_booking',{p_booking:id})),'Поръчката е завършена'))await refresh()}
const starInput=(name,label)=>`<div class="rate-row"><span>${label}</span><span class="star-in" role="radiogroup" aria-label="${label}">${[5,4,3,2,1].map(n=>`<input type="radio" id="${name}${n}" name="${name}" value="${n}" required><label for="${name}${n}" title="${n} от 5">★</label>`).join('')}</span></div>`;
const starsHtml=v=>{const n=Math.round(v);return `<span class="rating" aria-label="${v} от 5">${'★'.repeat(n)}<span class="star-off">${'★'.repeat(5-n)}</span></span>`};
function review(){let b=booking(selected);if(!b||b.customerId!==user()?.id||b.status!=='done')return orders();const p=byId(b.providerId);return `<button class="back" onclick="go('orders')">← Поръчки</button><h2>Оцени ${esc(p?.name||'специалиста')}</h2>${reviewForm(b)}`}
// Блок „Оцени“ в профила на специалиста: формата е тук, ако клиентът има приключена поръчка без отзив
function rateBox(p){const u=user();if(u?.id===p.id||u?.role==='admin')return '';
 if(!u)return `<div class="card rate-box" id="rate"><strong>⭐ Оцени ${esc(p.name)}</strong><p class="muted small">Влез като клиент, за да оставиш отзив.</p>${btn('Вход',"go('login')",'tiny secondary')}</div>`;
 if(u.role!=='customer')return '';
 const mine=db.bookings.filter(b=>b.customerId===u.id&&b.providerId===p.id),todo=mine.find(b=>b.status==='done'&&!db.reviews.some(r=>r.bookingId===b.id));
 if(todo)return `<div class="card rate-box" id="rate"><h3 style="margin-top:0">⭐ Как мина работата с ${esc(p.name)}?</h3>${reviewForm(todo)}</div>`;
 if(db.settings?.reviews_require_order===false&&!db.reviews.some(r=>r.customerId===u.id&&r.providerId===p.id&&!r.bookingId))return `<div class="card rate-box" id="rate"><h3 style="margin-top:0">⭐ Колко си доволен от ${esc(p.name)}?</h3><p class="muted small">Тестов режим: можеш да оцениш и без приключена поръчка.</p>${reviewForm({id:null,providerId:p.id})}</div>`;
 if(db.settings?.reviews_require_order===false&&db.reviews.some(r=>r.customerId===u.id&&r.providerId===p.id))return `<div class="card rate-box" id="rate"><strong>✓ Вече си оценил ${esc(p.name)}</strong><p class="muted small">Отзивът ти е по-долу. Нов отзив може след следваща приключена поръчка.</p></div>`;
 if(mine.some(b=>b.status==='booked'))return `<div class="card rate-box" id="rate"><strong>⭐ Отзив</strong><p class="muted small">Имаш поръчка при ${esc(p.name)}. Щом специалистът я маркира като завършена, ще можеш да го оцениш тук.</p></div>`;
 if(mine.length&&mine.every(b=>b.status!=='done'||db.reviews.some(r=>r.bookingId===b.id))&&mine.some(b=>b.status==='done'))return `<div class="card rate-box" id="rate"><strong>✓ Вече си оценил ${esc(p.name)}</strong><p class="muted small">Отзивът ти е по-долу. Нов отзив може след следваща приключена поръчка.</p></div>`;
 return `<div class="card rate-box" id="rate"><strong>⭐ Оцени ${esc(p.name)}</strong><p class="muted small">Отзив може да остави само клиент с приключена поръчка при този специалист. Така всички отзиви са от истински клиенти.</p>${btn('Резервирай',`requireLogin('direct','${p.id}')`,'tiny secondary')}</div>`}
function reviewForm(b){return `<p class="muted">Докосни звездичките за всяка категория, от 1 до 5. Общата оценка е средната от тях.</p><form onsubmit="addReview(event,'${b.id||''}','${b.providerId}')"><div class="card">${RATE_CATS.map(([k,l])=>starInput('r_'+k,l)).join('')}</div><label class="field">Отзив<textarea name="text" required maxlength="1000" placeholder="Как мина работата? Какво ти хареса?" ${wsAttrs}></textarea></label><div class="wsug"></div><label class="field">Снимки на готовата работа (до 5)<input type="file" accept="image/*" multiple onchange="pickImages(this,'reviewFiles',5)"></label><div id="preview">${reviewFiles.length?photosHtml(reviewFiles,'reviewFiles'):''}</div><button class="btn wide">Публикувай отзива</button></form>`}
async function addReview(e,id,pid){e.preventDefault();const b=id?booking(id):{providerId:pid},f=new FormData(e.target),u=user();if(!b?.providerId)return;const r={};for(const [k] of RATE_CATS){const v=Number(f.get('r_'+k));if(!v)return toast('Оцени всички категории');r['r_'+k]=v}const avg=Object.values(r).reduce((s,v)=>s+v,0)/RATE_CATS.length;busy(e.target,true);const ok=await act(async()=>{const t=Date.now(),photos=[];for(let i=0;i<reviewFiles.length;i++)photos.push(await upload('review-photos',`${u.id}/${id||'direct-'+b.providerId}/${t}-${i}.jpg`,reviewFiles[i]));chk(await sb.from('reviews').insert({booking_id:id||null,provider_id:b.providerId,customer_id:u.id,stars:Math.round(avg),text:String(f.get('text')).trim(),photos,...r}))},'Отзивът е публикуван');busy(e.target,false);if(ok){reviewFiles=[];reviewFilter='all';await loadAll();go('provider',b.providerId)}}
function reviewWall(p){const u=user(),all=db.reviews.filter(x=>x.providerId===p.id),vis=all.filter(x=>!x.hidden),shown=u?.role==='admin'?all:all.filter(x=>!x.hidden||x.customerId===u?.id||x.providerId===u?.id),withPh=shown.filter(x=>x.photos.length),list=reviewFilter==='photos'?withPh:shown;
 if(!shown.length)return '<h3>Отзиви</h3><p class="muted">Все още няма отзиви.</p>';
 const avg=k=>{const v=vis.map(x=>x.r[k]).filter(Boolean);return v.length?v.reduce((s,n)=>s+n,0)/v.length:0},score=Number(avgRating(p.id))||0,gallery=vis.filter(x=>x.photos.length).length>1?vis.flatMap(x=>x.photos).slice(0,8):[];
 return `<h3>Отзиви от клиенти</h3>${vis.length?`<div class="card rv-sum"><div class="rv-big"><div class="counter">${score.toFixed(1)}</div>${starsHtml(score)}<div class="muted small">${vis.length} ${vis.length===1?'отзив':'отзива'}</div></div><div class="rv-bars">${RATE_CATS.map(([k,l])=>{const a=avg(k);return a?`<div class="rv-bar"><span>${l}</span><span class="bar"><i style="width:${a/5*100}%"></i></span><b>${a.toFixed(1)}</b></div>`:''}).join('')}</div></div>`:''}${gallery.length?`<p class="muted small" style="margin:4px 0">Снимки от клиенти</p>${photosHtml(gallery)}`:''}<div class="tab"><button class="${reviewFilter==='all'?'active':''}" onclick="reviewFilter='all';render()">Всички (${shown.length})</button><button class="${reviewFilter==='photos'?'active':''}" onclick="reviewFilter='photos';render()">Със снимки (${withPh.length})</button></div>${list.map(x=>reviewCard(x,p,u)).join('')||'<p class="muted">Няма отзиви със снимки.</p>'}`}
function reviewCard(x,p,u){const c=byId(x.customerId),own=u&&x.customerId===u.id,acts=[];
 if(u?.id===p.id&&!x.reply)acts.push(`<details><summary>Отговори</summary><form onsubmit="replyReview(event,'${x.id}')"><textarea name="reply" required maxlength="1000" rows="3" placeholder="Благодаря за отзива…"></textarea><button class="btn tiny">Публикувай отговора</button></form></details>`);
 if(u&&!own&&u.role!=='admin')acts.push(`<details><summary>Докладвай</summary><form onsubmit="reportReview(event,'${x.id}')"><input name="reason" required maxlength="300" placeholder="Какъв е проблемът?"><button class="btn tiny ghost">Изпрати сигнал</button></form></details>`);
 if(u?.role==='admin')acts.push(btn(x.hidden?'Покажи отново':'Скрий отзива',`hideReview('${x.id}',${!x.hidden})`,'tiny secondary'));
 return `<div class="card rv${x.hidden?' rv-hidden':''}">${x.hidden?'<span class="chip gray">Скрит от администратор</span>':''}<div class="row" style="justify-content:flex-start;gap:10px">${c?avatarHtml(c):''}<div><strong>${esc(c?.name||'Клиент')}</strong><div class="muted small">${date(x.at)}</div></div><span style="margin-left:auto;text-align:right">${starsHtml(x.score)}<div class="muted small">${x.score.toFixed(1)} от 5</div></span></div>${Object.keys(x.r).length?`<div class="rv-tags">${RATE_CATS.filter(([k])=>x.r[k]).map(([k,l])=>`<span>${l} <b>${x.r[k]}★</b></span>`).join('')}</div>`:''}<p>${esc(x.text)}</p>${x.photos.length?photosHtml(x.photos):''}${x.reply?`<div class="rv-reply"><strong>Отговор от ${esc(p.name)}</strong><p>${esc(x.reply)}</p></div>`:''}${acts.length?`<div class="rv-acts">${acts.join('')}</div>`:''}</div>`}
async function replyReview(e,id){e.preventDefault();const t=String(new FormData(e.target).get('reply')).trim();busy(e.target,true);const ok=await act(async()=>chk(await sb.rpc('reply_review',{rid:id,body:t})),'Отговорът е публикуван');busy(e.target,false);if(ok)await refresh()}
async function reportReview(e,id){e.preventDefault();const reason=String(new FormData(e.target).get('reason')).trim();busy(e.target,true);const ok=await act(async()=>chk(await sb.from('reports').insert({reporter_id:user().id,target:'review:'+id,target_user_id:db.reviews.find(r=>r.id===id)?.customerId||null,reason})),'Сигналът е изпратен');busy(e.target,false);if(ok)e.target.closest('details').open=false}
async function hideReview(id,h){if(await act(async()=>chk(await sb.rpc('set_review_hidden',{rid:id,h})),h?'Отзивът е скрит':'Отзивът е видим отново'))await refresh()}
async function startChat(other){const u=user();if(!u)return go('login');if(u.id===other)return toast('Не можеш да пишеш на себе си');const o=byId(other),pair=u.role==='customer'&&o?.role==='provider'?[u.id,other]:u.role==='provider'&&o?.role==='customer'?[other,u.id]:null;if(!pair)return toast('Чатът е само между клиент и специалист');let c=db.conversations.find(c=>c.customerId===pair[0]&&c.providerId===pair[1]);if(!c){const r=await act(async()=>chk(await sb.from('conversations').insert({customer_id:pair[0],provider_id:pair[1]}).select().single()));if(!r)return;await loadAll();c=db.conversations.find(x=>x.id===r.id)}if(!c)return;chatConv=c.id;chatPartner=other;go('chat')}
function threadsHtml(activeId){const u=user();if(!u)return '';const threads=db.conversations.map(c=>({other:c.customerId===u.id?c.providerId:c.customerId,last:db.messages.filter(m=>m.conversationId===c.id).at(-1)})).sort((a,b)=>(b.last?.at||0)-(a.last?.at||0));return threads.map(t=>`<button class="card thread${t.other===activeId?' on':''}" style="display:block;text-align:left;width:100%" onclick="startChat('${t.other}')"><span class="row" style="justify-content:flex-start">${avatarHtml(byId(t.other))}<strong>${esc(byId(t.other)?.name)}</strong></span><p class="muted">${t.last?esc(t.last.text||'📷 Снимка')+' · '+date(t.last.at):'Още няма съобщения'}</p></button>`).join('')||'<div class="empty">Нямаш разговори. Отвори профил на специалист и изпрати съобщение.</div>'}
function conversations(){if(!user())return '';return `<h2>Съобщения</h2><div class="list">${threadsHtml()}</div>`}
function chat(){const u=user(),other=byId(chatPartner),c=db.conversations.find(x=>x.id===chatConv);if(!other||!c)return conversations();const mm=db.messages.filter(m=>m.conversationId===c.id);return `<div class="chat-split"><aside class="chat-side"><h3>Разговори</h3>${threadsHtml(other.id)}</aside><section class="chat-main"><button class="back" onclick="go('conversations')">← Разговори</button><div class="row" style="justify-content:flex-start">${avatarHtml(other)}<h2>${esc(other.name)}</h2></div><p class="muted">Съобщенията пристигат на живо.${u.role==='customer'&&other.role==='provider'?` <button class="link small" onclick="go('report','${other.id}')">⚑ Подай сигнал</button>`:''}</p><div class="card" id="chatlog" style="min-height:210px;max-height:55vh;overflow:auto">${mm.map(m=>`<div class="bubble ${m.from===u.id?'mine':''}"><div>${esc(m.text)}</div>${photosHtml(m.photos)}<div class="muted">${new Date(m.at).toLocaleTimeString(LOCALE(),{hour:'2-digit',minute:'2-digit'})}</div></div>`).join('')||'<p class="muted">Започни разговора.</p>'}</div><form onsubmit="sendMessage(event)"><label class="field">Съобщение<textarea name="text" rows="3" placeholder="Напиши съобщение..." ${wsAttrs}></textarea></label><div class="wsug"></div><label class="field">Снимки в чата (до 3)<input type="file" accept="image/*" multiple onchange="pickImages(this,'chatFiles',3)"></label><div id="preview">${chatFiles.length?photosHtml(chatFiles,'chatFiles'):''}</div><button class="btn wide">Изпрати</button></form></section></div>`}
async function sendMessage(e){e.preventDefault();const form=e.target,text=String(new FormData(form).get('text')||'').trim(),photos=[...chatFiles];if(!text&&!photos.length)return toast('Напиши съобщение или добави снимка');busy(form,true);const ok=await act(async()=>{const u=user();if(!photos.length)return chk(await sb.from('messages').insert({conversation_id:chatConv,sender_id:u.id,body:text}));for(const [i,p] of photos.entries()){const path=await upload('chat-images',`${chatConv}/${u.id}/${Date.now()}-${i}.jpg`,p);chk(await sb.from('messages').insert({conversation_id:chatConv,sender_id:u.id,body:i===0?text:'',image_path:path}))}});busy(form,false);if(ok){chatFiles=[];form.reset();await refresh()}}
function dashboard(){let u=user(),offers=db.offers.filter(o=>o.providerId===u.id),orders=db.bookings.filter(b=>b.providerId===u.id);return `<div class="hero"><div class="eyebrow">Панел на специалиста</div><h1>Здравей, ${esc(u.name.split(' ')[0])}.</h1><p class="muted">Управлявай заявките, офертите и разговорите.</p>${btn('Налични заявки',"go('requests')",'gold')}</div><div class="grid"><div class="card"><div class="counter">${offers.length}</div><p class="muted">Изпратени оферти</p></div><div class="card"><div class="counter">${orders.length}</div><p class="muted">Поръчки</p></div></div>${btn('Моят профил и портфолио',"go('account')",'wide secondary')}`}

async function editProfile(e){e.preventDefault();const f=new FormData(e.target),u=user(),patch={name:String(f.get('name')).trim(),city:f.get('city')};if(u.role==='provider')Object.assign(patch,{category:f.get('category'),subcategories:f.getAll('subs').filter(id=>subById(id)?.[3]===f.get('category')),bio:String(f.get('bio')),price:Number(f.get('price'))||0});if(badCity(patch.city))return;busy(e.target,true);const ok=await act(async()=>chk(await sb.from('profiles').update(patch).eq('id',u.id)),'Профилът е запазен');busy(e.target,false);if(ok)await refresh()}
async function addPortfolio(e){e.preventDefault();if(portfolioFiles.length!==2)return toast('Избери две снимки: преди и след');const form=e.target,title=String(new FormData(form).get('title')).trim(),u=user();busy(form,true);const ok=await act(async()=>{const t=Date.now(),b=await upload('portfolio',`${u.id}/${t}-before.jpg`,portfolioFiles[0]),a=await upload('portfolio',`${u.id}/${t}-after.jpg`,portfolioFiles[1]);chk(await sb.from('portfolio').insert({provider_id:u.id,title,before_path:b,after_path:a}))},'Проектът е добавен');busy(form,false);if(ok){portfolioFiles=[];await refresh()}}

 return `<h2>Известия</h2>${mine.length?`<div class="card"><strong>Оферти по твоите заявки</strong>${mine.map(([r,c])=>`<button class="notif-link" onclick="go('request','${r.id}');setTimeout(()=>$('#offers')?.scrollIntoView({behavior:'smooth'}),60)"><span>${esc(r.title)}</span><span class="chip">${c} ${c===1?'оферта':'оферти'} →</span></button>`).join('')}</div>`:''}${nn.length?nn.map(n=>{const l=NOTIF_LINK[n.linkPage];return l?`<button class="card notif${unread.has(n.id)?' unread':''}" onclick="openNotif('${n.id}')"><span class="notif-ico" aria-hidden="true">${l[0]}</span><span class="notif-body"><span>${esc(n.text)}</span><span class="muted small">${date(n.at)}</span></span><span class="notif-go">${l[1]} →</span></button>`:`<div class="card notif${unread.has(n.id)?' unread':''}"><span class="notif-ico" aria-hidden="true">🔔</span><span class="notif-body"><span>${esc(n.text)}</span><span class="muted small">${date(n.at)}</span></span></div>`}).join(''):'<div class="empty">Няма известия.</div>'}`}

 requests:{title:'Заявки',icon:'▤',items:()=>db.requests,sub:x=>x.status,subs:[['open','Отворени'],['booked','Приети'],['done','Завършени'],['cancelled','Отменени']],text:x=>[x.title,x.description,x.city,x.category,byId(x.customerId)?.name].join(' '),

 reports:{title:'Сигнали',icon:'⚑',items:()=>db.reports,sub:x=>reportRv(x)?'review':x.against?'person':'general',subs:[['person','Срещу човек'],['review','За отзив'],['general','Общи']],text:x=>[x.reason,x.target,byId(x.from)?.name,byId(x.against)?.name,byId(x.against)?.email].join(' '),card:x=>reportCard(x)}};
const subMatch=(t,x,v)=>v==='__susp'?isSusp(x):t.sub?.(x)===v;
function suspControls(x){if(x.role==='admin')return '';if(isSusp(x))return `<div class="susp-box"><strong>⛔ ${suspText(x)}</strong>${x.suspendReason?`<p class="small">Причина: ${esc(x.suspendReason)}</p>`:''}${x.suspendedAt?`<p class="muted small">Спрян на: ${dt(x.suspendedAt)}</p>`:''}${btn('✔ Възстанови профила',`restoreUser('${x.id}')`,'tiny secondary')}</div>`;
 return `<details class="susp-form"><summary>⛔ Спри временно или блокирай</summary><form onsubmit="suspendUser(event,'${x.id}')"><label class="field">Срок<select name="days"><option value="1">1 ден</option><option value="3">3 дни</option><option value="7" selected>7 дни</option><option value="30">30 дни</option><option value="perm">Безсрочно (блокиране)</option></select></label><label class="field">Причина (потребителят ще я види)<input name="reason" required maxlength="300" placeholder="напр. нарушени правила, сигнали от клиенти…"></label><button class="btn tiny danger">Потвърди</button></form></details>`}
async function suspendUser(e,id){e.preventDefault();const f=new FormData(e.target),d=f.get('days'),days=d==='perm'?null:Number(d),p=byId(id);if(!confirm(`${days===null?'Блокиране безсрочно':'Спиране за '+days+(days===1?' ден':' дни')} на ${p?.name}?`))return;if(await act(async()=>chk(await sb.rpc('admin_suspend',{uid:id,days,reason:String(f.get('reason')).trim()})),days===null?'Профилът е блокиран':'Профилът е спрян'))await refresh()}
async function restoreUser(id){if(!confirm(`Възстановяване на ${byId(id)?.name}?`))return;if(await act(async()=>chk(await sb.rpc('admin_suspend',{uid:id,days:0,reason:null})),'Профилът е възстановен'))await refresh()}
function suspendedScreen(u){const perm=u.suspendedUntil===Infinity;return `<div class="card susp-screen"><div class="susp-ico" aria-hidden="true">⛔</div><h2>Профилът ти е ${perm?'блокиран':'временно спрян'}</h2>${perm?'':`<p>Ще бъде активен отново на <strong>${new Date(u.suspendedUntil).toLocaleString(LOCALE(),{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</strong>.</p>`}${u.suspendReason?`<p><strong>Причина:</strong> ${esc(u.suspendReason)}</p>`:''}<p class="muted small">Докато профилът е спрян, не можеш да пускаш заявки, оферти, съобщения, резервации или отзиви. Ако смяташ, че е грешка, свържи се с администратора.</p>${btn('↪ Изход','logout()','secondary wide')}</div>`}
function adminFiltered(){const t=ADMIN_TABS[adminTab],q=adminQ.trim().toLowerCase();return t.items().filter(x=>(!adminSub||subMatch(t,x,adminSub))&&(!q||t.text(x).toLowerCase().includes(q)))}
function adminList(){const l=adminFiltered(),el=$('#admin-list');const h=l.length?l.map(ADMIN_TABS[adminTab].card).join(''):'<div class="empty">Няма резултати.</div>';if(el){el.innerHTML=h;$('#admin-found').textContent=`Показани: ${l.length}`}return h}

function admin(){if(user()?.role!=='admin')return home();const cnt=(a,f)=>a.filter(f).length,
 sums={users:`${cnt(db.users,x=>x.role==='customer')} клиенти · ${cnt(db.users,x=>x.role==='provider')} специалисти${cnt(db.users,isSusp)?` · ⛔ ${cnt(db.users,isSusp)} спрени`:''}`,requests:`${cnt(db.requests,x=>x.status==='open')} отворени`,bookings:`${cnt(db.bookings,x=>x.status==='booked')} активни`,reports:db.reports.length?'за преглед':'няма нови'},t=ADMIN_TABS[adminTab];

 ${t?`<section id="admin-panel"><div class="row"><h3>${t.icon} ${t.title}</h3>${btn('✕ Затвори',"adminOpen('')",'tiny ghost')}</div>${t.subs?`<div class="tab chips">${chip('Всички',!adminSub,"adminSub='';render()",t.items().length)}${t.subs.map(([v,l])=>chip(l,adminSub===v,`adminSub='${v}';render()`,t.items().filter(x=>subMatch(t,x,v)).length)).join('')}</div>`:''}<input class="adm-search" type="search" placeholder="Търси по име, имейл, град…" value="${esc(adminQ)}" oninput="adminQ=this.value;adminList()"><p id="admin-found" class="muted small">Показани: ${adminFiltered().length}</p><div id="admin-list" class="list">${adminList()}</div></section>`:''}`}
const reportRv=x=>/^review:/.test(x.target)&&db.reviews.find(r=>r.id===x.target.slice(7)),reportsAgainst=id=>db.reports.filter(r=>r.against===id).length;
function personBox(id,label){const p=byId(id);if(!p)return `<div class="report-who none"><p class="muted small">${label}</p><strong>Не е посочен конкретен човек</strong></div>`;const n=reportsAgainst(id);return `<div class="report-who"><p class="muted small">${label}</p><div class="requester-row">${p.avatar?`<img src="${p.avatar}" alt="">`:`<span class="requester-ini">${esc((p.name||'?').trim()[0]||'?')}</span>`}<div><strong>${esc(p.name)}</strong> <span class="chip ${p.role==='provider'?'':'gray'}">${ROLE_BG[p.role]||''}</span>${p.email?`<p class="small"><a href="mailto:${esc(p.email)}">✉ ${esc(p.email)}</a></p>`:''}<p class="muted small">${[p.category,p.city].filter(Boolean).map(esc).join(' · ')}</p><p class="small${n>1?' warn':''}">⚑ Сигнали срещу този човек: ${n}</p></div></div>${p.role==='provider'?btn('Към профила',`go('provider','${p.id}')`,'tiny ghost'):''}</div>`}
function reportCard(x){const rv=reportRv(x);return `<div class="card adm-item">${personBox(x.against,rv?'Сигнал срещу автора на отзив':'Сигнал срещу')}${rv?`<p class="muted small">Сигнал за отзив към ${esc(byId(rv.providerId)?.name||'')}</p><p>„${esc(rv.text)}“</p><p><strong>Причина:</strong> ${esc(x.reason)} · ${date(x.at)}</p><div class="grid">${btn(rv.hidden?'Покажи отново':'Скрий отзива',`hideReview('${rv.id}',${!rv.hidden})`,'tiny secondary')}${btn('Към профила',`go('provider','${rv.providerId}')`,'tiny ghost')}</div>`:`<p class="small"><strong>Относно:</strong> ${esc(x.target)} ${x.hidden?'<span class="chip gray">Скрит</span>':'<span class="chip">Видим в профила</span>'}</p><p>${esc(x.reason)}</p>${x.reply?`<div class="rv-reply"><strong>Отговор от ${nm(x.against)}</strong><p>${esc(x.reply)}</p></div>`:''}${x.against?btn(x.hidden?'Покажи отново в профила':'Скрий от профила',`hideReport('${x.id}',${!x.hidden})`,'tiny secondary'):''}`}<p class="muted small">Подаден от: <strong>${nm(x.from)}</strong>${byId(x.from)?.email?' · '+esc(byId(x.from).email):''} · ${dt(x.at)}</p></div>`}
async function toggleVerify(id){const p=byId(id);if(user()?.role!=='admin'||!p)return;if(await act(async()=>chk(await sb.from('profiles').update({verified:!p.verified}).eq('id',id))))await refresh()}
function reportPartners(u){const ids=new Set();db.bookings.forEach(b=>{if(b.customerId===u.id)ids.add(b.providerId);if(b.providerId===u.id)ids.add(b.customerId)});db.conversations.forEach(c=>{if(c.customerId===u.id)ids.add(c.providerId);if(c.providerId===u.id)ids.add(c.customerId)});db.offers.forEach(o=>{const r=req(o.requestId);if(r?.customerId===u.id)ids.add(o.providerId);if(o.providerId===u.id&&r)ids.add(r.customerId)});ids.delete(u.id);return [...ids].map(byId).filter(x=>x&&x.role!=='admin')}
